<div id="detalhe" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="detalhe-titulo">
    <div class="modal-fundo" data-fechar></div>
    <div class="modal-caixa">
        <header class="modal-topo">
            <div>
                <nav class="migalhas" id="detalhe-migalhas" aria-label="Nivel do detalhe"></nav>
                <h3 id="detalhe-titulo" class="modal-titulo"></h3>
                <div class="chips" id="detalhe-contexto"></div>
            </div>
            <button type="button" class="modal-fechar" data-fechar aria-label="Fechar">&times;</button>
        </header>
        <div class="modal-barra" id="detalhe-barra"></div>
        <div class="painel-tabela modal-tabela">
            <table class="tabela" id="detalhe-tabela">
                <thead id="detalhe-cabecalho"></thead>
                <tbody id="detalhe-corpo"></tbody>
                <tfoot id="detalhe-rodape"></tfoot>
            </table>
        </div>
    </div>
</div>
